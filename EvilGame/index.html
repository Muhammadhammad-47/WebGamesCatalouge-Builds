<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Level Devil | CIEL WebGames</title>
    
    <meta name="description" content="Play Level Devil on CIEL WebGames. An addictive, troll-filled rage platformer puzzle where the unexpected always happens.">
    <meta name="keywords" content="level devil, platformer, rage game, troll puzzle, ciel webgames, ciel tech, html5 games">
    <meta name="author" content="CIEL Tech">
    <meta name="theme-color" content="#1a0301">
    
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <!-- ============================================================= -->
    <!-- ADSENSE PLACEHOLDER                                           -->
    <!-- When ready, uncomment and insert your client ID:             -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX" crossorigin="anonymous"></script> -->
    <!-- ============================================================= -->
</head>
<body>

    <!-- Main Game Viewport -->
    <div id="gameWrapper">
        <div id="canvasContainer">
            <!-- 16:9 Canvas -->
            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <!-- HUD Overlay -->
            <div id="hudOverlay">
                <div class="hud-left">
                    <button id="btnPause" class="hud-btn" title="Pause (Esc / P)">⏸</button>
                    <button id="btnRestart" class="hud-btn" title="Restart (R)">🔄</button>
                    <button id="btnLevelSelect" class="hud-btn" title="Level Select">☰</button>
                </div>
                <div class="hud-center">
                    <span id="uiLevelNumber">LEVEL 1</span>
                    <span id="uiLevelTitle">BABY STEPS</span>
                </div>
                <div class="hud-right">
                    <span id="uiDeaths">DEATHS: 0</span>
                    <button id="btnMute" class="hud-btn" title="Toggle Sound">🔊</button>
                    <button id="btnFullscreen" class="hud-btn" title="Toggle Fullscreen">⛶</button>
                </div>
            </div>

            <!-- Touch Controls for Mobile Landscape -->
            <div id="touchControls">
                <div class="touch-cluster-left">
                    <button id="touchLeft" class="touch-btn" aria-label="Move Left">◀</button>
                    <button id="touchRight" class="touch-btn" aria-label="Move Right">▶</button>
                </div>
                <div class="touch-cluster-right">
                    <button id="touchJump" class="touch-btn jump" aria-label="Jump">▲</button>
                </div>
            </div>

            <!-- Pause Modal -->
            <div id="modalPause" class="modal">
                <div class="modal-content">
                    <h2 class="modal-title">GAME PAUSED</h2>
                    <div class="modal-buttons">
                        <button id="btnResume" class="btn-primary">RESUME</button>
                        <button class="btn-secondary" onclick="window.game.restartLevel(); window.game.togglePause();">RESTART LEVEL</button>
                        <button class="btn-secondary" onclick="window.game.showLevelSelect();">LEVEL SELECT</button>
                    </div>
                </div>
            </div>

            <!-- Level Select Modal -->
            <div id="modalLevelSelect" class="modal">
                <div class="modal-content" style="max-width: 520px;">
                    <h2 class="modal-title">SELECT LEVEL</h2>
                    <div id="levelGrid"></div>
                    <div class="modal-buttons" style="margin-top: 15px;">
                        <button id="btnCloseLevels" class="btn-secondary">CLOSE</button>
                    </div>
                </div>
            </div>

            <!-- Victory Modal -->
            <div id="modalVictory" class="modal">
                <div class="modal-content">
                    <h2 class="modal-title">🎉 YOU ESCAPED!</h2>
                    <p id="victoryText" style="line-height: 1.6; margin-bottom: 20px; font-size: 16px;"></p>
                    <div class="modal-buttons">
                        <button id="btnNextLevel" class="btn-primary">PLAY AGAIN</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Rotate Overlay -->
    <div id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <h2>PLEASE ROTATE YOUR DEVICE</h2>
        <p>Level Devil is designed to be played in landscape mode.</p>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/player.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
