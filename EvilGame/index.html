  <style type="text/css">
	/* Disable user selection to avoid strange bug in Chrome on Windows */
	body {
		position: fixed;
		margin: 0;
		padding: 0;
		background-color: #2c0701;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
		background: #6d1102;
		background: linear-gradient(135deg, rgba(109,17,2,1) 0%, rgba(109,17,2,1) 49%, rgba(109,17,2,1) 50%, rgba(109,17,2,1) 100%);
	}

	.canvas-app-container:-webkit-full-screen {
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		-moz-outline-style: none;
	}

	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	.canvas-app-progress {
		position: absolute;
		top: calc(50vh + max(5vh, 10vw));
		left: 50%;
		transform: translateX(-50%);
		background-color: #2f1509;
		width: 20vw;
		height: 1vw;
	}

	.canvas-app-progress-bar {
		font-size: 12px;
		height: 100%;
		color: rgb(0, 255, 38);
		background-color: #d34f2b;
		text-align: center;
		line-height: 20px;
		transition: transform 1s ease;
		transform-origin: left;
		transform: scaleX(1.0);
	}

	.link, .button {
		font-family: sans-serif;
		font-size: 14px;
		font-weight: normal;
		line-height: normal;
		letter-spacing: 0px;
		padding-top: 12px;
	}

	.buttons-background {

	.canvas-app-canvas {

		image-rendering: pixelated;
	}

	#ciel-watermark {
		position: absolute;
		bottom: 12px;
		left: 50%;

		color: rgba(255, 255, 255, 0.4);

		font-weight: 600;
		letter-spacing: 1px;
		text-transform: uppercase;
		pointer-events: none;
		z-index: 10;
	}
  </style>

        // [ADSENSE REWARDED AD PLACEHOLDER]

      },
      displayAd: function(e, t, o, i) { if (i) i(true); if (o) o(); },
      destroyAd: function() {},
      getLeaderboard: function() { return Promise.resolve(); },
      shareableURL: function() { return Promise.reject(); },
      getURLParam: function() { return ''; },
      getLanguage: function() { return (navigator.language || 'en').split('-')[0]; },
      getDeviceInfo: function() {
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        return { category: isMobile ? 'mobile' : 'desktop' };
      },
      isAdBlocked: function() { return false; },
      measure: function() {},

  <script>
    if (typeof globalThis === 'undefined') {
      window.globalThis = window;
    }
  </script>
  <script id="engine-loader" type="text/javascript" src="dmloader.js"></script>
  <script id="engine-setup" type="text/javascript"></script>
  <script id="engine-start" type="text/javascript">
    var runningFromFileWarning = document.getElementById("running-from-file-warning");
    if (window.location.href.startsWith("file://")) {
      runningFromFileWarning.style.display = "block";
    } else {
      EngineLoader.load("canvas", "LevelDevil");
      if (runningFromFileWarning && runningFromFileWarning.parentNode) {
        runningFromFileWarning.parentNode.removeChild(runningFromFileWarning);
      }
    }
  </script>
  <script type="text/javascript">
    async function clipboard_copy(thing_to_copy) {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(thing_to_copy);
      }
    }
  </script>
  <script id="poki-sdk-setup" type="text/javascript">
    var isWasmLoaded = false;
    var isPokiSDKInited = false;
    var runFunc = function() {
      if (isPokiSDKInited && isWasmLoaded) {
        Module.runApp("canvas");
      }
    };
    Module['onRuntimeInitialized'] = function() {
      isWasmLoaded = true;
      runFunc();
    };

    function startEngine() {
      var data = {};
      var isLoadFinished = false;
      if (typeof Progress !== 'undefined') {
        Progress.addListener(function(percentage) {
          data.percentageDone = percentage / 100;
          if (!isLoadFinished && window.PokiSDK) {
            window.PokiSDK.gameLoadingProgress(data);
          }
          if (percentage === 100 && !isLoadFinished) {
            if (window.PokiSDK) window.PokiSDK.gameLoadingFinished();
            isLoadFinished = true;
          }
        });
      }
      isPokiSDKInited = true;
      runFunc();
    }

    // Launch immediately
    startEngine();
  </script>
