<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blocky Blast Puzzle</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- TOP HEADER -->
        <header class="game-header">
            <div class="header-left">
                <button id="btn-back" class="icon-btn" title="Leave Game" aria-label="Leave Game">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="score-box main-score">
                    <span class="score-label">Score</span>
                    <span id="current-score" class="score-value">0</span>
                </div>
            </div>

            <div class="header-right">
                <div class="score-box">
                    <svg class="trophy-icon" viewBox="0 0 24 24" fill="#FBBF24">
                        <path d="M19 4h-3V2H8v2H5c-1.1 0-2 .9-2 2v2c0 2.5 1.9 4.6 4.4 4.9.7 1.6 2.1 2.8 3.8 3.1V19H9v2h6v-2h-2.2v-3c1.7-.3 3.1-1.5 3.8-3.1 2.5-.3 4.4-2.4 4.4-4.9V6c0-1.1-.9-2-2-2zM5 8V6h3v4.8C6.3 10.4 5 9.4 5 8zm14 0c0 1.4-1.3 2.4-3 2.8V6h3v2z"/>
                    </svg>
                    <span id="best-score" class="score-value">0</span>
                </div>
                <button id="btn-mute" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
                    <svg class="sound-on-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/>
                    </svg>
                    <svg class="sound-off-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M16.5 12c0-1.8-1-3.3-2.5-4v2.2l2.5 2.5c0-.2 0-.5 0-.7zM19 12c0 1.2-.3 2.4-.8 3.4l1.5 1.5c1-1.5 1.6-3.2 1.6-4.9 0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zm-2.5 8.1l-1.4-1.4v-2.1l-5-5H3V9h4.9L3.4 4.5 4.8 3.1l15.6 15.6-1.4 1.4zM12 4L9.9 6.1l2.1 2.1V4z"/>
                    </svg>
                </button>
                <button id="btn-restart" class="icon-btn" title="Restart Game" aria-label="Restart Game">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 8x8 BOARD -->
        <main class="board-container">
            <div id="game-board" class="game-board"></div>
        </main>

        <!-- 3-PIECE DOCK -->
        <footer class="piece-dock" id="piece-dock"></footer>

        <!-- PARTICLES LAYER -->
        <div id="particles-layer"></div>

        <!-- GAME OVER MODAL -->
        <div id="game-over-modal" class="game-modal" role="dialog" aria-modal="true">
            <div class="modal-card">
                <h2 class="modal-title">NO MORE MOVES!</h2>
                <div class="modal-scores">
                    <div class="modal-score-item">
                        <span class="modal-label">Final Score</span>
                        <span id="final-score" class="modal-value">0</span>
                    </div>
                    <div class="modal-score-item">
                        <span class="modal-label">Best Score</span>
                        <span id="final-best" class="modal-value gold">0</span>
                    </div>
                </div>
                <button id="btn-play-again" class="btn-primary">Play Again</button>
            </div>
        </div>

        <!-- PORTAL EXIT MODAL -->
        <div id="exit-modal" class="game-modal" role="dialog" aria-modal="true">
            <div class="modal-card">
                <h2 class="modal-title" style="color: #38BDF8;">LEAVE GAME?</h2>
                <p style="color: #94A3B8; font-size: 15px; margin-bottom: 20px;">
                    Are you sure you want to exit?<br>Your high score is safely saved.
                </p>
                <div class="exit-modal-actions">
                    <button id="btn-confirm-exit" class="btn-exit-danger">Exit</button>
                    <button id="btn-cancel-exit" class="btn-exit-stay">Keep Playing</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/audio.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/board.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/game.js"></script>

    <!-- PORTAL BACK NAVIGATION -->
    <script>
    (function() {
        const backBtn = document.getElementById('btn-back');
        const exitModal = document.getElementById('exit-modal');
        const confirmExit = document.getElementById('btn-confirm-exit');
        const cancelExit = document.getElementById('btn-cancel-exit');

        function openModal() {
            if (exitModal) exitModal.classList.add('active');
        }
        function closeModal() {
            if (exitModal) exitModal.classList.remove('active');
        }
        function doExit() {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action: 'closeModal', type: 'GAME_ENDED' }, '*');
                    window.parent.postMessage('closeModal', '*');
                }
            } catch (e) {}

            try { window.close(); } catch (e) {}

            setTimeout(() => {
                if (window.history && window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '../';
                }
            }, 120);
        }

        if (backBtn) backBtn.addEventListener('click', openModal);
        if (cancelExit) cancelExit.addEventListener('click', closeModal);
        if (confirmExit) confirmExit.addEventListener('click', doExit);
        if (exitModal) {
            exitModal.addEventListener('click', (e) => {
                if (e.target === exitModal) closeModal();
            });
        }
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (exitModal && exitModal.classList.contains('active')) {
                    closeModal();
                } else {
                    openModal();
                }
            }
        });
    })();
    </script>
</body>
</html>
