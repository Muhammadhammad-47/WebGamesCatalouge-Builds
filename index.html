        if (navigator.userAgent.match(/IEMobile\/10\.0/)) {

            msViewportStyle.appendChild(

        </script>
        <script>
        window.addEventListener('keydown', ev => {
            if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
                ev.preventDefault();
            }
            });
         window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });
        </script>

        <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
        <script>
        // Resilient PokiSDK fallback bridge
        (function() {
            if (typeof window.PokiSDK === 'undefined') {
                window.PokiSDK = {
                    init: function() { return Promise.resolve(); },
                    gameLoadingFinished: function() {},
                    gameLoadingStart: function() {},
                    gameplayStart: function() {},
                    gameplayStop: function() {},
                    commercialBreak: function(fn) { if (fn) fn(); return Promise.resolve(); },
                    rewardedBreak: function(fn) { if (fn) fn(); return Promise.resolve(true); },
                    displayAd: function(e, t, o, i) { if (i) i(true); if (o) o(); },
                    destroyAd: function() {},
                    getLeaderboard: function() { return Promise.resolve(); },
                    shareableURL: function() { return Promise.reject(); },
                    getURLParam: function() { return ''; },
                    getLanguage: function() { return (navigator.language || 'en').split('-')[0]; },
                    getDeviceInfo: function() { return { category: 'desktop' }; },
                    isAdBlocked: function() { return false; },
                    measure: function() {}
                };
            } else {
                var origCommercial = window.PokiSDK.commercialBreak;
                if (typeof origCommercial === 'function') {
                    window.PokiSDK.commercialBreak = function(fn) {
                        return new Promise(function(resolve) {
                            var done = false;
                            var timer = setTimeout(function() {
                                if (!done) {
                                    done = true;
                                    if (fn) fn();
                                    resolve();
                                }
                            }, 1000);
                            try {
                                origCommercial.call(window.PokiSDK, fn).then(function() {
                                    if (!done) {
                                        done = true;
                                        clearTimeout(timer);
                                        resolve();
                                    }
                                }).catch(function() {
                                    if (!done) {
                                        done = true;
                                        clearTimeout(timer);
                                        resolve();
                                    }
                                });
                            } catch(e) {
                                if (!done) {
                                    done = true;
                                    clearTimeout(timer);
                                    resolve();
                                }
                            }
                        });
                    };
                }
                var origRewarded = window.PokiSDK.rewardedBreak;
                if (typeof origRewarded === 'function') {
                    window.PokiSDK.rewardedBreak = function(fn) {
                        return new Promise(function(resolve) {
                            var done = false;
                            var timer = setTimeout(function() {
                                if (!done) {
                                    done = true;
                                    if (fn) fn();
                                    resolve(true);
                                }
                            }, 1000);
                            try {
                                origRewarded.call(window.PokiSDK, fn).then(function(success) {
                                    if (!done) {
                                        done = true;
                                        clearTimeout(timer);
                                        resolve(success !== false);
                                    }
                                }).catch(function() {
                                    if (!done) {
                                        done = true;
                                        clearTimeout(timer);
                                        resolve(true);
                                    }
                                });
                            } catch(e) {
                                if (!done) {
                                    done = true;
                                    clearTimeout(timer);
                                    resolve(true);
                                }
                            }
                        });
                    };
                }
            }
        })();
        </script>
