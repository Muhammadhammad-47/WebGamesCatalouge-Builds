<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIEL Web Arcade - Play Free WebGL Games Online</title>
  <meta name="description" content="Play the best high-quality mobile and WebGL arcade games directly in your browser. Fast, free, and ad-supported!">
  
  <!-- Favicon & Stylesheet -->
  <link rel="stylesheet" href="portal.css">
  
  <!-- Open Graph -->
  <meta property="og:title" content="CIEL Web Arcade - Free Online WebGL Games">
  <meta property="og:description" content="Play instantly on mobile or desktop without downloads.">
  <meta property="og:type" content="website">
</head>
<body>

  <!-- Header / Navbar -->
  <header>
    <div class="container nav-wrapper">
      <a href="./" class="logo-brand">
        <div class="logo-icon">C</div>
        <div class="logo-text">CIEL ARCADE</div>
        <span class="logo-badge">WEBGL</span>
        <span class="total-games-pill" id="headerTotalGames">0 Games</span>
      </a>

      <!-- Search Box -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search games, categories..." id="gameSearch">
      </div>
    </div>
  </header>

  <!-- Main Portal Content -->
  <main class="container">
    
    <!-- Hero Featured Game Section -->
    <section class="hero-section">
      <div class="hero-card" id="heroCard">
        <!-- Dynamically populated via portal.js -->
      </div>
    </section>

    <!-- Categories & Filter Section -->
    <section class="category-section">
      <div class="category-header-row">
        <div class="section-heading">
          <span>🎮</span> All Catalogue Games
          <span class="games-count-badge" id="gamesCountBadge">0</span>
        </div>
        <div class="sort-controls">
          <label for="sortSelect" class="sort-label">Sort:</label>
          <select id="sortSelect" class="sort-select">
            <option value="recent" selected>🕒 Recent First</option>
            <option value="rating">⭐ Top Rated</option>
            <option value="az">🔤 Name (A–Z)</option>
          </select>
        </div>
      </div>
      <div class="filter-pills">
        <button class="pill-btn active" data-category="all">All Games</button>
        <button class="pill-btn" data-category="puzzle">Puzzle</button>
        <button class="pill-btn" data-category="arcade">Arcade</button>
        <button class="pill-btn" data-category="action">Action</button>
        <button class="pill-btn" data-category="casual">Casual</button>
        <button class="pill-btn" data-category="simulation">Simulation</button>
      </div>
    </section>

    <!-- Games Card Grid -->
    <section class="games-grid" id="gamesGrid">
      <!-- Dynamically populated via portal.js -->
    </section>

  </main>

  <!-- In-Page Embedded Game Player Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Game Title</div>
        <div class="modal-controls">
          <a id="modalExternalBtn" href="#" target="_blank" class="btn-modal-icon" title="Open in new tab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <button id="modalFullscreenBtn" class="btn-modal-icon" title="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button id="modalCloseBtn" class="btn-modal-icon btn-modal-close" title="Close">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="modalIframe" src="" allow="autoplay; fullscreen; camera; focus-without-user-activation *"></iframe>
      </div>
    </div>
  </div>

  <!-- Game Module Details / Assets Download Modal -->
  <div class="modal-overlay" id="gameInfoModal">
    <div class="info-modal-container">
      <div class="modal-header">
        <div class="modal-title" id="infoModalTitle">Game Details</div>
        <button id="infoModalCloseBtn" class="btn-modal-icon btn-modal-close" title="Close">✕</button>
      </div>
      <div class="info-modal-body">
        <div class="info-modal-top">
          <img id="infoModalThumb" class="info-modal-thumb" src="" alt="Game Thumbnail">
          <div class="info-modal-meta">
            <div class="info-badges">
              <span class="info-badge-cat" id="infoModalCategory">Arcade</span>
              <span class="info-badge-orient" id="infoModalOrient">Landscape</span>
              <span class="info-badge-rating" id="infoModalRating">★ 4.9</span>
            </div>
            <p class="info-modal-desc" id="infoModalDesc"></p>
          </div>
        </div>

        <div class="info-link-section">
          <label class="info-label">🔗 Live Game Link</label>
          <div class="info-link-row">
            <input type="text" id="infoModalLinkInput" class="info-link-input" readonly>
            <button id="infoCopyLinkBtn" class="btn-info-action btn-copy">📋 Copy</button>
            <a id="infoOpenLinkBtn" href="#" target="_blank" class="btn-info-action btn-open">↗ Open</a>
          </div>
        </div>

        <div class="info-downloads-section">
          <button id="infoDownloadJsonBtn" class="btn-download btn-download-json">
            <span>📄</span> Download JSON
          </button>
          <button id="infoDownloadThumbBtn" class="btn-download btn-download-thumb">
            <span>🖼️</span> Download Thumbnail
          </button>
          <button id="infoPlayPortalBtn" class="btn-download btn-play-now">
            <span>▶</span> Play in Portal
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="footer-text">
        © 2026 <strong>CIEL Tech</strong>. Built with Unity WebGL & Web Monetization Bridge.
      </p>
    </div>
  </footer>

  <!-- Script -->
  <script src="portal.js"></script>
</body>
</html>
