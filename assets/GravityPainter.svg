<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Tunnel Tiles -->
  <rect x="0" y="0" width="640" height="40" fill="#312e81"/>
  <rect x="0" y="320" width="640" height="40" fill="#312e81"/>
  <!-- Painted Floor Tiles -->
  <rect x="60" y="320" width="340" height="12" fill="#22c55e"/>
  <rect x="420" y="320" width="180" height="12" fill="#eab308"/>
  <rect x="180" y="28" width="260" height="12" fill="#ec4899"/>
  <!-- Paint Drops -->
  <circle cx="160" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="480" cy="140" r="14" fill="#38bdf8"/>
  <!-- Splotch Hero Ball -->
  <circle cx="280" cy="300" r="28" fill="url(#glow)"/>
  <circle cx="272" cy="292" r="5" fill="#ffffff"/>
  <circle cx="288" cy="292" r="5" fill="#ffffff"/>
  <circle cx="273" cy="292" r="2" fill="#1e1b4b"/>
  <circle cx="289" cy="292" r="2" fill="#1e1b4b"/>
  <!-- Title Badge -->
  <rect x="110" y="80" width="420" height="90" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#6366f1" stroke-width="3"/>
  <text x="320" y="125" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff">GRAVITY FLIP</text>
  <text x="320" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#38bdf8">PAINTER</text>
  <rect x="250" y="200" width="140" height="36" rx="18" fill="#10b981"/>
  <text x="320" y="224" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#ffffff">PLAY NOW</text>
</svg>