<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tile Trio | CIEL Games</title>
  <meta name="description" content="Tap tiles into the tray and match three of a kind to clear the board.">
  <meta name="theme-color" content="#3b1478">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='8' width='52' height='52' rx='12' fill='%23c99e6a'/%3E%3Crect x='6' y='4' width='52' height='50' rx='12' fill='%23fff8ea'/%3E%3Ccircle cx='32' cy='29' r='14' fill='%23e8323f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="at-home">
  <!-- CIEL Games loading screen -->
  <script src="ciel-loader.js?v=1"></script>

  <div id="app">
    <header id="hud">
      <button class="round-btn" id="homeBtn" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M6 10v9h4.5v-5h3v5H18v-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="level-pill">Level <b id="lvl">1</b></div>
      <div class="coins-pill"><i class="coin"></i><b id="coins">0</b></div>
      <button class="round-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.4 7.4 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4.9 2-3.4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div id="tip"></div>
    <main id="board"></main>

    <div id="trayWrap">
      <div id="tray">
        <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
      </div>
    </div>

    <nav id="boosters">
      <button class="booster" data-b="undo" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 7 4 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 11.5H14a5.5 5.5 0 0 1 0 11h-2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" transform="translate(0 -3)"/></svg>
        <span class="count"></span>
        <small>Undo</small>
      </button>
      <button class="booster" data-b="magnet" aria-label="Magnet">
        <svg viewBox="0 0 24 24"><path d="M5 4h4v8a3 3 0 0 0 6 0V4h4v8a7 7 0 0 1-14 0Z" fill="currentColor"/><path d="M5 4h4v3H5zM15 4h4v3h-4z" fill="#fff" opacity=".85"/></svg>
        <span class="count"></span>
        <small>Magnet</small>
      </button>
      <button class="booster" data-b="shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.8 0 3-1.6 4.1-3.6M13.4 9.6C14.5 8 15.8 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="count"></span>
        <small>Shuffle</small>
      </button>
    </nav>

    <div id="stage"></div>
    <div id="fx"></div>
  </div>

  <!-- Full-window overlays live outside #app so they always cover the whole screen -->
  <section id="home">
      <button class="round-btn home-close" id="backBtn" aria-label="Close game" title="Close game">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>
      </button>
      <div class="home-inner">
        <div class="brand"><span class="brand-mark">CIEL</span><span class="brand-word">GAMES</span></div>
        <div id="logoTiles"></div>
        <h1 class="logo">Tile <span>Trio</span></h1>
        <p class="tag">Tap tiles. Match three. Clear the board.</p>
        <p class="by">A CIEL Games original</p>
        <button class="btn big green" id="playBtn">Play <small>Level <b id="playLvl">1</b></small></button>
        <div class="home-row">
          <button class="toggle" id="sndBtn"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on-only" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Sound</button>
          <button class="toggle" id="musBtn"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/></svg>Music</button>
        </div>
      </div>
  </section>

  <div id="modal" class="hidden"><div class="card" id="card"></div></div>
  <div id="toast"></div>

  <script src="audio.js?v=5"></script>
  <script src="art.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
