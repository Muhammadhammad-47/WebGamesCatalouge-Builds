<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Monkey Mart | CIEL WebGames</title>
    <meta name="title" content="Monkey Mart | CIEL WebGames">
    <meta name="description" content="Play Monkey Mart! Run your own supermarket, harvest bananas, sell products to customers and expand your monkey grocery empire in pure HTML5 and JavaScript.">
    <meta name="keywords" content="monkey mart, idle game, simulation, supermarket, standalone, html5 game">

    <link rel="icon" type="image/png" href="assets/monkey-mart.png">
    <link rel="apple-touch-icon" href="assets/monkey-mart.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Game Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- Dynamic Floating Virtual Joystick -->
        <div id="joystick-container">
            <div class="joystick-base">
                <div class="joystick-knob"></div>
            </div>
        </div>

        <!-- HUD Layer -->
        <div id="hud">
            <div class="hud-top">
                <!-- Cash Counter -->
                <div class="cash-badge" id="cash-badge">
                    <div class="cash-icon">$</div>
                    <div class="cash-amount" id="cash-display">0</div>
                </div>

                <!-- Action & Settings Buttons -->
                <div class="hud-buttons">
                    <button class="hud-btn hats-btn" id="btn-hats" title="Hats & Outfits">🧢</button>
                    <button class="hud-btn upgrade-btn" id="btn-upgrades" title="Upgrades">⚡</button>
                    <button class="hud-btn settings-btn" id="btn-settings" title="Settings">⚙️</button>
                </div>
            </div>

            <!-- Capacity Stack Counter -->
            <div class="capacity-badge" id="capacity-badge">
                <span class="capacity-icon">🎒</span>
                <span id="capacity-display">0 / 4</span>
            </div>

            <!-- Desktop Controls Tip -->
            <div class="desktop-controls-tip">
                🕹️ Move: <b>WASD</b> / <b>Arrow Keys</b> or <b>Click & Drag</b>
            </div>
        </div>

        <!-- Upgrades Modal -->
        <div class="modal-overlay" id="modal-upgrades">
            <div class="modal-box">
                <div class="modal-header">
                    <div class="modal-title">⚡ Upgrades</div>
                    <div class="close-btn" id="close-upgrades">&times;</div>
                </div>
                <div class="upgrade-list" id="upgrade-list">
                    <!-- Populated dynamically by game.js -->
                </div>
            </div>
        </div>

        <!-- Hats Modal -->
        <div class="modal-overlay" id="modal-hats">
            <div class="modal-box">
                <div class="modal-header">
                    <div class="modal-title">🧢 Hat Shop</div>
                    <div class="close-btn" id="close-hats">&times;</div>
                </div>
                <div class="hats-grid" id="hats-grid">
                    <!-- Populated dynamically by game.js -->
                </div>
            </div>
        </div>

        <!-- Settings Modal (100% Local Controls) -->
        <div class="modal-overlay" id="modal-settings">
            <div class="modal-box">
                <div class="modal-header">
                    <div class="modal-title">⚙️ Settings</div>
                    <div class="close-btn" id="close-settings">&times;</div>
                </div>
                <div class="settings-list" id="settings-list">
                    <div class="setting-row">
                        <div class="setting-info">
                            <span class="setting-icon">🎵</span>
                            <div>
                                <div class="setting-title">Music</div>
                                <div class="setting-desc">Store BGM loop</div>
                            </div>
                        </div>
                        <button class="toggle-btn active" id="toggle-music">ON</button>
                    </div>

                    <div class="setting-row">
                        <div class="setting-info">
                            <span class="setting-icon">🔊</span>
                            <div>
                                <div class="setting-title">Sound Effects</div>
                                <div class="setting-desc">Pops, coins & cash dings</div>
                            </div>
                        </div>
                        <button class="toggle-btn active" id="toggle-sfx">ON</button>
                    </div>

                    <div class="setting-row">
                        <div class="setting-info">
                            <span class="setting-icon">🕹️</span>
                            <div>
                                <div class="setting-title">Joystick Mode</div>
                                <div class="setting-desc" id="joystick-desc">Dynamic (Follows Touch)</div>
                            </div>
                        </div>
                        <button class="toggle-btn" id="toggle-joystick">DYNAMIC</button>
                    </div>

                    <div class="setting-row">
                        <div class="setting-info">
                            <span class="setting-icon">📱</span>
                            <div>
                                <div class="setting-title">Full Screen</div>
                                <div class="setting-desc">Toggle display mode</div>
                            </div>
                        </div>
                        <button class="toggle-btn" id="toggle-fullscreen">EXPAND</button>
                    </div>

                    <div class="setting-row danger">
                        <div class="setting-info">
                            <span class="setting-icon">🗑️</span>
                            <div>
                                <div class="setting-title">Reset Progress</div>
                                <div class="setting-desc">Clear local save data</div>
                            </div>
                        </div>
                        <button class="danger-btn" id="btn-reset-data">RESET</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Logic (Pure, Editable JavaScript) -->
    <script src="game.js"></script>
</body>
</html>
